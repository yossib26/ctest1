<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
    }
    .card {
      width: 100%;
      max-width: 340px;
      margin: 16px;
      padding: 32px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: 24px; color: #333; }
    p { color: #555; font-size: 14px; }
    .success { color: #188038; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #155ab6; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title"></h1>
    <p class="success">You have logged in successfully.</p>
    <p>Role: <strong id="role"></strong></p>
    <button id="logout">Log out</button>
  </div>

  <script>
    let user = null;
    try { user = JSON.parse(sessionStorage.getItem("user")); } catch (e) {}

    // Not logged in - back to the login page
    if (!user) {
      location.replace("login.html");
    } else {
      document.getElementById("title").textContent = "Welcome, " + user.username + "!";
      document.getElementById("role").textContent = user.role === "admin" ? "Administrator" : "Regular user";
    }

    document.getElementById("logout").addEventListener("click", function () {
      sessionStorage.removeItem("user");
      location.replace("login.html");
    });
  </script>
</body>
</html>
