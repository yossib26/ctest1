<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
    }
    .card {
      width: 100%;
      max-width: 340px;
      margin: 16px;
      padding: 32px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 24px; font-size: 24px; text-align: center; color: #333; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #155ab6; }
    #message { margin-top: 16px; text-align: center; font-size: 14px; min-height: 18px; }
    .error { color: #d93025; }
    .success { color: #188038; }
    .loader {
      width: 48px;
      height: 48px;
      margin: 8px auto 16px;
      border: 5px solid #e0e0e0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="loginCard">
    <h1>LOGIN</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" value="admin" required>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" value="1234" required>

      <button type="submit">Sign in</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    // Coming back from welcome.html after the session timed out
    if (new URLSearchParams(location.search).get("expired") === "1") {
      const message = document.getElementById("message");
      message.textContent = "Your session expired. Please log in again.";
      message.className = "error";
    }

    // Credentials are checked by the server against the Neon users table
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;
      const message = document.getElementById("message");
      message.textContent = "Checking...";
      message.className = "";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();

        if (data.ok) {
          // Remember who logged in, show the loader for 2 seconds, then go to the message page
          try {
            sessionStorage.setItem("user", JSON.stringify({ username: data.username, role: data.role, loginAt: Date.now() }));
          } catch (e) {}
          document.getElementById("loginCard").innerHTML =
            '<div class="loader"></div>' +
            '<p style="text-align:center;color:#555;">Signing you in...</p>';
          setTimeout(function () { location.href = "welcome.html"; }, 2000);
        } else {
          message.textContent = data.error || "Invalid username or password";
          message.className = "error";
        }
      } catch (err) {
        message.textContent = location.protocol === "file:"
          ? "Open this page via http://localhost:8080 (not as a file)"
          : "Cannot reach the server - is server.ps1 running?";
        message.className = "error";
      }
    });
  </script>
</body>
</html>
