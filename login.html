<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
    }
    .card {
      width: 100%;
      max-width: 340px;
      margin: 16px;
      padding: 32px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 24px; font-size: 24px; text-align: center; color: #333; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #1a73e8;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #155ab6; }
    #message { margin-top: 16px; text-align: center; font-size: 14px; min-height: 18px; }
    .error { color: #d93025; }
    .success { color: #188038; }
  </style>
</head>
<body>
  <div class="card" id="loginCard">
    <h1>Login</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    // Hard-coded credentials (for demo purposes only)
    const VALID_USER = "admin";
    const VALID_PASSWORD = "1234";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (user === VALID_USER && pass === VALID_PASSWORD) {
        document.getElementById("loginCard").innerHTML =
          '<h1>Welcome, ' + VALID_USER + '!</h1>' +
          '<p style="text-align:center;color:#188038;">You have logged in successfully.</p>' +
          '<button onclick="location.reload()">Log out</button>';
      } else {
        message.textContent = "Invalid username or password";
        message.className = "error";
      }
    });
  </script>
</body>
</html>
